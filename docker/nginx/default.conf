server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    # Prometheus metrics: internal networks only (the app also checks METRICS_TOKEN).
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass app:9000;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
        fastcgi_pass app:9000;
    }
}
