# Local / demo stack: `make setup && docker compose up -d`
x-env: &env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  LOG_CHANNEL: json

x-app: &app
  build:
    context: .
    target: runtime
  image: questboard:local
  env_file: .env
  environment: *env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  init:
    <<: *app
    restart: "no"
    environment:
      <<: *env
      RUN_MIGRATIONS: "true"
      RUN_SEEDER: "${SEED_DEMO_DATA:-true}"
    command: ["php", "artisan", "leaderboard:rebuild"]

  app:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
    depends_on:
      init:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-questboard}
      MYSQL_USER: ${DB_USERNAME:-questboard}
      MYSQL_PASSWORD: ${DB_PASSWORD:-questboard}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  db-data:
  redis-data:
